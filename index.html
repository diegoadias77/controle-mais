<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D4FC4">
<script>try{var t=localStorage.getItem('diario-tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<meta name="description" content="Controle+ · viva melhor. Refeições por foto, calorias, água, peso e aplicações semanais.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Controle+">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Controle+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#EEF1EC; --surface:#FAFBF8; --surface-2:#E4E9E2; --line:#D3DAD0;
  --ink:#16211F; --ink-2:#4B5A55; --ink-3:#7A8883;
  --accent:#2D4FC4; --accent-ink:#FFFFFF; --accent-soft:#DDE4FA;
  --protein:#B8701A; --protein-soft:#F4E4CC;
  --water:#1A7F95; --water-soft:#D2ECF1;
  --good:#2E7D4F; --warn:#B26A00; --bad:#B3372F; --bad-soft:#F6DCD9;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101614; --surface:#18201E; --surface-2:#212B28; --line:#2E3A36;
    --ink:#E8EEEA; --ink-2:#AAB7B2; --ink-3:#7D8B86;
    --accent:#8FA6FF; --accent-ink:#0F1733; --accent-soft:#1F2A52;
    --protein:#E6A24C; --protein-soft:#3A2C18;
    --water:#5CC3D8; --water-soft:#16343B;
    --good:#6FCB94; --warn:#E3A948; --bad:#F08A80; --bad-soft:#3D1F1C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101614; --surface:#18201E; --surface-2:#212B28; --line:#2E3A36;
  --ink:#E8EEEA; --ink-2:#AAB7B2; --ink-3:#7D8B86;
  --accent:#8FA6FF; --accent-ink:#0F1733; --accent-soft:#1F2A52;
  --protein:#E6A24C; --protein-soft:#3A2C18;
  --water:#5CC3D8; --water-soft:#16343B;
  --good:#6FCB94; --warn:#E3A948; --bad:#F08A80; --bad-soft:#3D1F1C;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:0 96px}
.app{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{font-family:var(--display);font-size:20px;white-space:nowrap;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--accent);margin-left:1px}
@media (max-width:390px){.brand small{display:none}}
.brand small{font-family:var(--body);font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:.02em;margin-left:10px;vertical-align:3px}
.top-r{display:flex;align-items:center;gap:8px}
.theme-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.theme-btn svg{width:18px;height:18px;stroke:var(--ink-2);fill:none;stroke-width:1.8}
.sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.ok::before{background:var(--good)} .sync.saving::before{background:var(--warn)} .sync.err::before{background:var(--bad)}
main{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--ink-2)} .small{font-size:13px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar b{font-family:var(--display);font-size:17px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.icon{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:18px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
textarea{width:100%;resize:vertical;min-height:70px}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 130px}
.field span{font-size:12px;color:var(--ink-2);font-weight:500}
.card > .field{flex:none}
/* dose hero */
.dose{background:var(--accent);color:var(--accent-ink);border:none}
.dose .label{color:inherit;opacity:.75}
.dose .big{font-family:var(--display);font-size:25px;font-weight:700;line-height:1.1}
.dose .sub{opacity:.85;font-size:14px}
.dose .btn{background:var(--accent-ink);color:var(--accent);border:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.dose .pill{background:rgba(255,255,255,.18);color:inherit}
.pill.warn{background:var(--bad-soft);color:var(--bad)}
/* meters */
.meter{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;transition:width .3s}
.m-protein i{background:var(--protein)} .m-water i{background:var(--water)}
.stat{display:flex;align-items:baseline;gap:6px}
.stat .v{font-family:var(--mono);font-size:26px;font-weight:500}
.stat .g{color:var(--ink-3);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip.food{border-radius:10px;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;padding:7px 10px}
.chip.food b{font-family:var(--mono);font-weight:500;color:var(--protein);font-size:13px}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.entries{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.entries li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
.entries li .num{color:var(--protein)}
.water-row .btn{color:var(--water)}
.alert{background:var(--bad-soft);border-color:transparent;color:var(--ink)}
.alert b{color:var(--bad)}
/* stats grid */
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--bg);border-radius:10px;padding:10px 12px}
.tile .v{font-family:var(--mono);font-size:20px}
.tile .k{font-size:12px;color:var(--ink-3)}
.chartbox{width:100%;overflow-x:auto}
svg text{font-family:var(--mono);font-size:17px;fill:var(--ink-3)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:6px 6px 6px 0}
td{padding:7px 6px 7px 0;border-top:1px solid var(--line);vertical-align:top}
td.num{white-space:nowrap}
.tablebox{overflow-x:auto}
.empty{color:var(--ink-3);font-size:14px;padding:6px 0}
.sites{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sites .chip{border-radius:10px;text-align:left}
.sites .chip.sug{border-style:dashed;border-color:var(--accent)}
.doselist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.mg{font-family:var(--mono);background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:2px 8px;font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;max-width:560px}
nav.tabs button{border:none;background:transparent;border-radius:10px;padding:8px 2px;font-size:12px;font-weight:600;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
/* calorias e foto */
.m-kcal i{background:var(--accent)} .m-kcal.over i{background:var(--bad)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.duo .stat .v{font-size:22px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis .tile .v{font-size:17px}
.photo-cta{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.photo-cta svg{width:30px;height:30px;stroke:var(--accent);fill:none;stroke-width:1.8}
.photo-cta b{display:block;font-size:15px}
.photo-cta span{font-size:13px;color:var(--ink-2)}
.shot{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:start}
.shot img{width:92px;height:92px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr 64px auto;gap:6px 8px;align-items:center;background:var(--bg);border-radius:10px;padding:8px 10px}
.item input{padding:6px 8px;font-size:14px;background:var(--surface)}
.item .meta{grid-column:1/-1;font-size:12px;color:var(--ink-2);display:flex;gap:12px}
.item .meta b{font-family:var(--mono);font-weight:500}
.totals{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:4px 2px}
.totals b{font-family:var(--mono);font-weight:500}
.thinking{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:14px}
.thinking i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.meal-tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.entries li .k{font-family:var(--mono);color:var(--ink-2);font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.profile-res{background:var(--accent-soft);border:none}
.cta-profile{border:1.5px dashed var(--accent)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;padding:10px 6px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;text-align:center;cursor:pointer;color:var(--ink)}
.qbtn svg{width:26px;height:26px;fill:none;stroke-width:1.8}
.qbtn small{font-weight:500;color:var(--ink-3);font-family:var(--mono);font-size:11px}
.qbtn.photo{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)} .qbtn.photo svg{stroke:currentColor}
.qbtn.water svg{stroke:var(--water)} .qbtn.weight svg{stroke:var(--protein)}
.qbtn:active{transform:scale(.97)}
.rem{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;background:var(--bg)}
.rem .head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600}
.rem input[type=time]{padding:6px 8px;background:var(--surface)}
.rem select{padding:6px 8px;background:var(--surface)}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;inset:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--line);pointer-events:none;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked+i{background:var(--accent)} .switch input:checked+i::after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;overflow:hidden;padding:0;flex:none;color:var(--ink-3);font-weight:700;font-family:var(--display)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.big{width:96px;height:96px;font-size:34px}
.hello{font-size:13px;color:var(--ink-2);text-align:center}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative;aspect-ratio:3/4;border-radius:12px;border:1.5px dashed var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;overflow:hidden;font-size:12px;font-weight:600;color:var(--ink-2);text-align:center;padding:6px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .tag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px}
.slot svg{width:34px;height:40px;stroke:var(--ink-3);fill:none;stroke-width:1.6}
.slot.done{border-style:solid;border-color:var(--accent)}
.meas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.meas input,.grid4 input,.field input,.field select{width:100%;min-width:0}
.meas .field span b{color:var(--ink);font-weight:600}
.meas .field small{font-size:11px;color:var(--ink-3)}
.cmp{position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--surface-2);--pos:50%}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp img.top{clip-path:inset(0 calc(100% - var(--pos)) 0 0)}
.cmp::after{content:"";position:absolute;top:0;bottom:0;left:var(--pos);width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);pointer-events:none}
.cmp input[type=range]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.cmp .lb{position:absolute;top:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;pointer-events:none}
.cmp .lb.l{left:8px} .cmp .lb.r{right:8px}
.duo-img{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duo-img figure{margin:0;display:flex;flex-direction:column;gap:4px}
.duo-img img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--surface-2)}
.duo-img figcaption{font-size:12px;color:var(--ink-2);text-align:center}
.ind{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ind .tile .st{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;border-radius:99px;padding:1px 8px}
.st.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.st.mid{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.st.hi{background:var(--bad-soft);color:var(--bad)}
.dneg{color:var(--good)} .dpos{color:var(--warn)}
.cklist li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center}
.cklist img{width:52px;height:68px;object-fit:cover;border-radius:8px;background:var(--surface-2)}
.lock{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-block:28px}
.lock svg{width:42px;height:42px;stroke:var(--accent);fill:none;stroke-width:1.8}
.lock input{font-family:var(--mono);font-size:26px;letter-spacing:.5em;text-align:center;width:180px}
.guide{font-size:13px;color:var(--ink-2);margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px)}body{-webkit-tap-highlight-color:transparent}</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Controle<span>+</span><small>viva melhor</small></div>
    <div class="top-r"><div id="sync" class="sync">Carregando…</div>
      <button class="theme-btn" id="theme-btn" aria-label="Alternar tema claro ou escuro"></button><button class="avatar" id="top-avatar" aria-label="Perfil"></button></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="Seções">
  <div class="in">
    <button data-v="hoje"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Hoje</button>
    <button data-v="doses"><svg viewBox="0 0 24 24"><path d="M14 4l6 6M17 7l-9 9-3 1 1-3 9-9M7 17l-3 3"/></svg>Doses</button>
    <button data-v="evolucao"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><path d="M8 21l1-8-3-4 6 1 6-1-3 4 1 8"/></svg>Evolução</button>
    <button data-v="progresso"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg>Progresso</button>
    <button data-v="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>Ajustes</button>
  </div>
</nav>
<div id="toast" class="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const fmtDate=(s,o={day:'2-digit',month:'short'})=>parse(s).toLocaleDateString('pt-BR',o).replace('.','');
const fmtN=(n,d=1)=>Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const numIn=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null;};

function download(filename,text,type){
  const blob=new Blob([text],{type});
  let file=null;try{file=new File([blob],filename,{type});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){
    navigator.share({files:[file],title:filename}).catch(()=>{});return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

/* ---------- fotos no aparelho (IndexedDB) ---------- */
const IDB={_db:null,
  open(){return this._db||(this._db=new Promise((res,rej)=>{const r=indexedDB.open('controle-fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('fotos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('fotos',mode),st=t.objectStore('fotos'),rq=fn(st);t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);});},
  put(k,v){return this.tx('readwrite',st=>st.put(v,k));},
  get(k){return this.tx('readonly',st=>st.get(k));},
  del(k){return this.tx('readwrite',st=>st.delete(k));},
  keys(){return this.tx('readonly',st=>st.getAllKeys());}};
let urlCache={};
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});}
function dataURLToBlob(u){const [h,d]=u.split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg';const bin=atob(d);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime});}
async function loadBitmap(blob){
  try{return await createImageBitmap(blob,{imageOrientation:'from-image'});}catch(e){}
  return await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(blob);});
}
async function compress(blob,max,q,square){
  const src=await loadBitmap(blob);const w=src.width||src.naturalWidth,h=src.height||src.naturalHeight;
  let sx=0,sy=0,sw=w,sh=h;if(square){const m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=m;}
  const sc=Math.min(1,max/Math.max(sw,sh));const c=document.createElement('canvas');c.width=Math.round(sw*sc);c.height=Math.round(sh*sc);
  c.getContext('2d').drawImage(src,sx,sy,sw,sh,0,0,c.width,c.height);
  return await new Promise(res=>c.toBlob(res,'image/jpeg',q));
}

async function toJpegB64(blob){
  let src=null;
  try{src=await createImageBitmap(blob,{imageOrientation:'from-image'});}catch(e){src=null;}
  if(!src){src=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(blob);});}
  const w=src.width||src.naturalWidth,h=src.height||src.naturalHeight,sc=Math.min(1,1280/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.85).split(',')[1];
}
function parseJSON(t){
  try{return JSON.parse(t);}catch(e){}
  const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1]);}catch(e){}}
  const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e){}}
  throw {code:'invalid_json'};
}
async function apiCall(content,maxTokens,signal){
  const key=getKey();if(!key)throw {code:'no_key'};
  let r;
  try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:getModel(),max_tokens:maxTokens,messages:[{role:'user',content}]})});}
  catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled'};throw {code:navigator.onLine===false?'offline':'network'};}
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok){const msg=(j&&j.error&&j.error.message)||'';
    if(r.status===401)throw {code:'auth'};
    if(r.status===403)throw {code:'forbidden'};
    if(r.status===429)throw {code:'rate_limited'};
    if(/credit|balance|billing/i.test(msg))throw {code:'credit'};
    if(r.status===404||/model/i.test(msg))throw {code:'model'};
    if(r.status>=500)throw {code:'overloaded'};
    throw {code:'api',message:msg};}
  return (j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
}
async function callClaude(prompt,blob,signal){
  let data;try{data=await toJpegB64(blob);}catch(e){throw {code:'image_rejected'};}
  const text=await apiCall([{type:'image',source:{type:'base64',media_type:'image/jpeg',data}},{type:'text',text:prompt}],1500,signal);
  return parseJSON(text);
}

/* ---------- helpers ---------- */
function day(date){return S.days[date]||{};}
function dayMut(date){const d=JSON.parse(JSON.stringify(S.days[date]||{}));S.days={...S.days,[date]:d};return d;}
function proteinOf(d){return Math.round((d.meals||[]).reduce((s,m)=>s+(+m.p||0),0));}
function kcalOf(d){return Math.round((d.meals||[]).reduce((s,m)=>s+(+m.k||0),0));}
function weightAt(date){const ws=weights().filter(x=>x.date<=date);return ws.length?ws[ws.length-1].w:(S.cfg.startWeight??null);}
function profileOK(){const c=S.cfg;return !!(c.sex&&c.age&&c.height&&weightAt(today())!=null);}
/* Mifflin-St Jeor */
function energy(date){
  const c=S.cfg,w=weightAt(date||today());
  if(!profileOK()||w==null)return null;
  const bmr=10*w+6.25*c.height-5*c.age+(c.sex==='M'?5:-161);
  const tdee=bmr*(c.activity||1.2);
  const floor=c.sex==='M'?1500:1200;
  const raw=tdee-(c.deficit||500);
  const target=Math.max(raw,floor);
  return {w,bmr:Math.round(bmr),tdee:Math.round(tdee),target:Math.round(target),floor,floored:raw<floor,deficit:Math.round(tdee-target)};
}
function mealDefault(){const h=new Date().getHours();return h<10?0:h<15?1:h<18?2:3;}
function weights(){return Object.keys(S.days).filter(k=>S.days[k].weight!=null).sort().map(k=>({date:k,w:+S.days[k].weight}));}
function lastDose(){return S.doses[0]||null;}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function weeksAtDose(){const ds=S.doses;if(!ds.length)return 0;const mg=ds[0].mg;let first=ds[0].date;for(const d of ds){if(d.mg!==mg)break;first=d.date;}return Math.floor(diffDays(first,today())/7)+1;}
function nextSite(){const l=lastDose();if(!l)return SITES[0];const i=SITES.indexOf(l.site);return SITES[(i+1)%SITES.length];}
function isTyping(){const a=document.activeElement;return a&&$('#main').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);}

function mealList(d){

async function analyze(){
  if(!getKey()){toast('Cadastre sua chave de API em Ajustes.');return;}
  const h=$('#photo-hint');if(h)photo.hint=h.value.trim();
  photo.status='thinking';photo.ctl=new AbortController();document.activeElement&&document.activeElement.blur();render();
  const prompt=`Você é um nutricionista brasileiro. A imagem é a foto de um prato de comida que uma pessoa vai comer.
Identifique cada alimento visível, estime a porção de cada um em gramas (como servido, cozido) e calcule a proteína (g) e as calorias (kcal) de cada porção, usando valores da tabela TACO e preparos típicos no Brasil. Considere óleo/azeite de preparo quando visível.
${photo.hint?'Informação da pessoa sobre o prato: "'+photo.hint.slice(0,300)+'". Use isso para corrigir a identificação.\n':''}Se a imagem não for comida, devolva itens vazio e explique na observação.
Responda SOMENTE com JSON neste formato:
{"itens":[{"alimento":"Arroz branco cozido","gramas":120,"proteina":3.0,"kcal":154}],"observacao":"frase curta sobre o que pode estar impreciso"}`;
  try{
    const r=await callClaude(prompt,photo.blob,photo.ctl.signal);
    const arr=Array.isArray(r&&r.itens)?r.itens:[];
    photo.items=arr.map(x=>{const g=Math.max(1,+x.gramas||0),p=Math.max(0,+x.proteina||0),k=Math.max(0,+x.kcal||0);
      return {n:String(x.alimento||'Alimento').slice(0,80),g,p,k,pg:p/g,kg:k/g};}).filter(x=>x.n);
    photo.note=r&&r.observacao?String(r.observacao).slice(0,240):'';
    photo.status='result';
  }catch(e){
    if(e&&e.code==='cancelled'){photo.status='ready';}
    else{photo.status='error';photo.err=SAMPLE_ERR[e&&e.code]||'Falha de conexão durante a análise. Tente de novo.';}
  }
  render();
}

function drawChart(){
  const box=$('#chart');if(!box)return;
  const ws=weights().slice(-120);
  if(ws.length<2){box.innerHTML='<div class="empty">Registre o peso em pelo menos dois dias para ver a curva.</div>';return;}
  const W=600,H=240,L=50,R=14,T=16,B=30;
  const g=S.cfg.goalWeight;
  let lo=Math.min(...ws.map(x=>x.w)),hi=Math.max(...ws.map(x=>x.w));
  if(g!=null&&g>=lo-6)lo=Math.min(lo,g);
  lo=Math.floor(lo-0.5);hi=Math.ceil(hi+0.5);if(hi-lo<4)hi=lo+4;
  const span=diffDays(ws[0].date,ws[ws.length-1].date)||1;
  const x=d=>L+(W-L-R)*diffDays(ws[0].date,d)/span;
  const y=v=>T+(H-T-B)*(hi-v)/(hi-lo);
  const step=Math.max(1,Math.ceil((hi-lo)/4));
  let grid='';for(let v=lo;v<=hi;v+=step){grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;}
  const pts=ws.map(p=>[x(p.date),y(p.w)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L${pts[pts.length-1][0].toFixed(1)} ${H-B} L${pts[0][0].toFixed(1)} ${H-B} Z`;
  const goal=g!=null&&g>=lo&&g<=hi?`<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--good)" stroke-dasharray="5 5"/>`:'';
  const doseMarks=S.doses.filter(d=>d.date>=ws[0].date&&d.date<=ws[ws.length-1].date).map(d=>`<line x1="${x(d.date)}" x2="${x(d.date)}" y1="${H-B}" y2="${H-B+5}" stroke="var(--accent)" stroke-width="2"/>`).join('');
  const lp=pts[pts.length-1];
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolução do peso">
    ${grid}${goal}
    <path d="${area}" fill="var(--accent)" fill-opacity=".10"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    ${doseMarks}
    <circle cx="${lp[0]}" cy="${lp[1]}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${L}" y="${H-6}">${esc(fmtDate(ws[0].date))}</text>
    <text x="${W-R}" y="${H-6}" text-anchor="end">${esc(fmtDate(ws[ws.length-1].date))}</text>
  </svg><div class="small muted">Marcas azuis no eixo = aplicações.</div>`;
}

function getRem(){const r=S.cfg.rem||{},o={};for(const k in DEFAULT_REM)o[k]={...DEFAULT_REM[k],...(r[k]||{})};
  o.meals.times=(o.meals.times&&o.meals.times.length===4)?o.meals.times:DEFAULT_REM.meals.times;
  if(o.dose.day==null){const l=lastDose();o.dose.day=l?parse(l.date).getDay():new Date().getDay();}
  return o;}
function hm2m(t){const [h,m]=String(t||'0:0').split(':').map(Number);return h*60+(m||0);}
function m2hm(n){return pad(Math.floor(n/60))+':'+pad(n%60);}
function waterTimes(R){const out=[];const a=hm2m(R.water.from),b=hm2m(R.water.to),st=Math.max(30,Math.round(R.water.every*60));for(let t=a;t<=b&&out.length<24;t+=st)out.push(m2hm(t));return out;}
function remCount(){const R=getRem();let n=0;if(R.water.on)n+=waterTimes(R).length;if(R.meals.on)n+=4;if(R.weight.on)n+=1;return n;}
function jump(id){const el=document.getElementById(id);if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}
function icsEsc(t){return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function icsFold(line){const out=[];let s=line;while(s.length>72){out.push(s.slice(0,72));s=' '+s.slice(72);}out.push(s);return out.join('\r\n');}
function buildICS(){
  const R=getRem(),base=location.href.split('#')[0],d0=today().replace(/-/g,'');

    'BEGIN:VTIMEZONE','TZID:America/Sao_Paulo','BEGIN:STANDARD','DTSTART:19700101T000000','TZOFFSETFROM:-0300','TZOFFSETTO:-0300','TZNAME:-03','END:STANDARD','END:VTIMEZONE'];

  if(R.weight.on)add('peso',d0,R.weight.time,'Pesar em jejum','Suba na balança antes de comer e registre o peso no app.','peso','FREQ=DAILY');
  if(R.checkin.on){const n=new Date();let d=new Date(n.getFullYear(),n.getMonth(),R.checkin.day);if(iso(d)<today())d=new Date(n.getFullYear(),n.getMonth()+1,R.checkin.day);
    add('checkin',iso(d).replace(/-/g,''),R.checkin.time,'Check-in mensal','Fotos de frente, lado e costas e medidas com fita. Abra a aba Evolução.','evolucao','FREQ=MONTHLY;BYMONTHDAY='+R.checkin.day);}
  if(R.dose.on){const now=new Date();let dd=(R.dose.day-now.getDay()+7)%7;const dt=addDays(today(),dd).replace(/-/g,'');const l=lastDose();

  L.push('END:VCALENDAR');

function drawKcal(){
  const box=$('#kchart');if(!box)return;
  const days=[...Array(7)].map((_,i)=>addDays(today(),i-6));
  const data=days.map(k=>({k,v:kcalOf(day(k)),e:energy(k)}));
  const logged=data.filter(x=>x.v>0);
  if(!logged.length){box.innerHTML='<div class="empty">Registre refeições para ver as calorias da semana.</div>';$('#kcal-sum').textContent='';return;}
  const tgt=(data.find(x=>x.e)||{}).e;
  const W=600,H=230,L=58,R=12,T=24,B=30;
  const hi=Math.ceil(Math.max(...data.map(x=>x.v),tgt?tgt.tdee:0,1000)/500)*500;
  const y=v=>T+(H-T-B)*(1-v/hi), bw=(W-L-R)/7;
  let g='';const st=hi>2000?1000:500;for(let v=0;v<=hi;v+=st){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;}
  const bars=data.map((x,i)=>{const cx=L+bw*i+bw*0.18,w=bw*0.64,over=x.e&&x.v>x.e.target;
    const lbl=parse(x.k).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
    return `${x.v?`<rect x="${cx}" y="${y(x.v)}" width="${w}" height="${y(0)-y(x.v)}" rx="4" fill="${over?'var(--bad)':'var(--accent)'}" fill-opacity="${x.k===today()?1:.75}"/><text x="${cx+w/2}" y="${y(x.v)-5}" text-anchor="middle">${x.v}</text>`:''}
      <text x="${cx+w/2}" y="${H-8}" text-anchor="middle">${esc(lbl)}</text>`;}).join('');
  const tl=tgt?`<line x1="${L}" x2="${W-R}" y1="${y(tgt.target)}" y2="${y(tgt.target)}" stroke="var(--good)" stroke-dasharray="5 5" stroke-width="1.5"/>
    <line x1="${L}" x2="${W-R}" y1="${y(tgt.tdee)}" y2="${y(tgt.tdee)}" stroke="var(--ink-3)" stroke-dasharray="2 4" stroke-width="1.5"/>`:'';
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Calorias por dia na última semana">${g}${tl}${bars}</svg>
    ${tgt?'<div class="small muted">Tracejado verde = meta de consumo. Pontilhado cinza = gasto diário. Barra vermelha = acima da meta.</div>':''}`;
  if(tgt){const def=logged.reduce((s,x)=>s+((x.e||tgt).tdee-x.v),0);
    $('#kcal-sum').textContent=`déficit acumulado ${def>=0?'':'+'}${Math.abs(r0(def))} kcal ≈ ${def>=0?'−':'+'}${fmtN(Math.abs(def)/KCAL_KG,2)} kg`;}
  else $('#kcal-sum').textContent='';
}

  if(pts.length<2){box.innerHTML='<div class="empty">O gráfico aparece a partir do segundo check-in com cintura.</div>';return;}
  const W=600,H=220,L=50,R=20,T=26,B=30;let lo=Math.floor(Math.min(...pts.map(p=>p.v))-2),hi=Math.ceil(Math.max(...pts.map(p=>p.v))+2);
  const x=i=>L+(W-L-R)*i/(pts.length-1),y=v=>T+(H-T-B)*(hi-v)/(hi-lo);
  const st=Math.max(1,Math.ceil((hi-lo)/4));let g='';for(let v=lo;v<=hi;v+=st)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+5}" text-anchor="end">${v}</text>`;
  const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cintura por check-in">${g}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text x="${x(i)}" y="${y(p.v)-10}" text-anchor="middle">${fmtN(p.v,0)}</text>`).join('')}
    <text x="${L}" y="${H-6}">${esc(fmtDate(pts[0].d))}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${esc(fmtDate(pts[pts.length-1].d))}</text></svg>`;
}

  if(t.id==='photo-hint'){if(photo)photo.hint=t.value;return;}
  if(/^it-/.test(t.id||''))return;
  if(t.id==='weight'){const d=dayMut(selDate),w=numIn(t.value);if(w==null)delete d.weight;else d.weight=w;store.saveDay(selDate);}
  else if(t.id==='notes'){const d=dayMut(selDate);d.notes=t.value;store.saveDay(selDate);}
  else if(t.id&&t.id.startsWith('c-')){S.cfg={...S.cfg,[t.id.slice(2)]:numIn(t.value)};store.saveCfg();}
  else return;
  pendingRender=true;
});

async function saveCheckin(btn){
  if(!ck)return;
  ['ck-date','ck-weight',...MEAS.map(x=>'ck-m-'+x.k)].forEach(id=>{const el=$('#'+id);if(!el)return;
    if(id==='ck-date')ck.date=el.value||today();else if(id==='ck-weight')ck.weight=numIn(el.value);else{const v=numIn(el.value),k=id.slice(5);if(v==null)delete ck.m[k];else ck.m[k]=v;}});
  if(!Object.keys(ck.files).length&&!Object.keys(ck.m).length){toast('Adicione pelo menos uma foto ou uma medida.');return;}
  btn.disabled=true;btn.textContent='Salvando…';
  const id='ck'+Date.now().toString(36),photos={};
  try{for(const p of POSES){const f=ck.files[p.k];if(!f)continue;const b=await compress(f,1080,0.82);const pid=id+'-'+p.k;await IDB.put(pid,b);photos[p.k]=pid;}}
  catch(e){btn.disabled=false;btn.textContent='Salvar check-in';toast('Não consegui salvar as fotos. Verifique o espaço do aparelho.');return;}
  const rec={id,date:ck.date,weight:ck.weight??null,m:{...ck.m},photos};
  S.checkins=[...(S.checkins||[]),rec];saveAll();
  if(ck.weight!=null&&day(ck.date).weight==null){const d=dayMut(ck.date);d.weight=ck.weight;store.saveDay(ck.date);}
  Object.values(ck.previews).forEach(u=>{try{URL.revokeObjectURL(u);}catch(e){}});ck=null;cmpB=id;
  view='evolucao';render();window.scrollTo(0,0);toast('Check-in salvo');
}
async function deleteCheckin(id){
  const c=(S.checkins||[]).find(x=>x.id===id);if(!c)return;
  for(const k in (c.photos||{})){try{await IDB.del(c.photos[k]);}catch(e){}if(urlCache[c.photos[k]]){URL.revokeObjectURL(urlCache[c.photos[k]]);delete urlCache[c.photos[k]];}}
  S.checkins=S.checkins.filter(x=>x.id!==id);saveAll();render();toast('Check-in excluído');
}
async function unlock(){const v=($('#pin-in')||{}).value||'';
  if(!/^\d{4}$/.test(v)){pinMsg='Digite os 4 números.';render();return;}
  if(await sha(v)===lsGet('controle-pin','')){evoUnlocked=true;pinMsg='';render();}else{pinMsg='PIN incorreto.';render();setTimeout(()=>{const i=$('#pin-in');if(i)i.focus();},50);}}
async function createPin(){const v=($('#pin-new')||{}).value||'';if(!/^\d{4}$/.test(v)){toast('O PIN precisa ter 4 números.');return;}
  lsSet('controle-pin',await sha(v));evoUnlocked=true;document.activeElement.blur();render();toast('PIN criado');}
async function removePin(){const v=($('#pin-cur')||{}).value||'';if(await sha(v)!==lsGet('controle-pin','')){toast('PIN atual incorreto.');return;}
  lsSet('controle-pin',null);document.activeElement.blur();render();toast('PIN removido');}
async function forgotPin(){
  for(const c of (S.checkins||[]))for(const k in (c.photos||{})){try{await IDB.del(c.photos[k]);}catch(e){}}
  S.checkins=(S.checkins||[]).map(c=>({...c,photos:{}}));saveAll();urlCache={avatar:urlCache.avatar};lsSet('controle-pin',null);evoUnlocked=true;render();toast('PIN e fotos de evolução apagados');}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&hasPin()){evoUnlocked=false;if(view==='evolucao'||view==='checkin'){pinMsg='';}}else if(!document.hidden&&hasPin()&&(view==='evolucao'))render();});
$('#top-avatar').addEventListener('click',()=>{view='ajustes';render();window.scrollTo(0,0);});

async function exportCSV(){
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=['data;peso_kg;calorias_kcal;meta_kcal;gasto_kcal;proteina_g;agua_ml;sintomas;observacoes'];
  Object.keys(S.days).sort().forEach(k=>{const d=S.days[k],en=energy(k);rows.push([k,d.weight!=null?fmtN(d.weight):'',kcalOf(d)||'',en?en.target:'',en?en.tdee:'',proteinOf(d)||'',d.water||'',q((d.symptoms||[]).join(', ')),q(d.notes)].join(';'));});
  rows.push('','refeicao_data;refeicao;alimento;gramas;proteina_g;calorias_kcal;origem');
  Object.keys(S.days).sort().forEach(k=>(S.days[k].meals||[]).forEach(m=>rows.push([k,q(m.m||''),q(m.n),m.g||'',m.p!=null?fmtN(m.p,1):'',m.k!=null?r0(m.k):'',m.src==='foto'?'foto':'manual'].join(';'))));
  rows.push('','checkin_data;peso_kg;'+MEAS.map(x=>x.k+'_cm').join(';')+';gordura_pct;cintura_altura');
  checkins().forEach(c=>{const I=indicators(c);rows.push([c.date,c.weight!=null?fmtN(c.weight):'',...MEAS.map(x=>(c.m||{})[x.k]!=null?fmtN(c.m[x.k]):''),I.bf!=null?fmtN(I.bf,1):'',I.whtr!=null?fmtN(I.whtr,2):''].join(';'));});
  rows.push('','aplicacao_data;dose_mg;local;observacoes');
  [...S.doses].reverse().forEach(x=>rows.push([x.date,fmtN(x.mg,x.mg%1?1:0),q(x.site),q(x.notes)].join(';')));
  download('controle-mais-'+today()+'.csv','\ufeff'+rows.join('\r\n'),'text/csv');
}

applyTheme();
render();
initStore().then(()=>{render();handleHash();});
function handleHash(){const h=(location.hash||'').slice(1);if(!h)return;
  if(h==='dose'){view='doses';render();}
  else if(h==='evolucao'){view='evolucao';render();}
  else if(['agua','refeicao','peso'].includes(h)){view='hoje';selDate=today();render();setTimeout(()=>jump({agua:'sec-agua',refeicao:'sec-refeicoes',peso:'sec-peso'}[h]),150);}
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
window.addEventListener('hashchange',handleHash);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
